<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cuestionario PSP</title>
  <link rel="stylesheet" href="styles.css?v=2">
  <script>
    // Aplica el tema guardado antes de pintar la página (evita un parpadeo).
    try {
      const t = localStorage.getItem("psp-tema");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo oscuro">
    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <main id="app">

    <!-- Inicio -->
    <section id="screen-start" class="screen active">
      <p class="eyebrow">Personal Software Process</p>
      <h1>Cuestionario PSP</h1>
      <p class="muted lead">25 preguntas de opción múltiple</p>
      <form id="start-form" class="start-form" autocomplete="off">
        <input id="player-name" type="text" placeholder="Escribe tu nombre" maxlength="40" required>
        <button type="submit" class="btn btn-primary">Comenzar</button>
      </form>
    </section>

    <!-- Pregunta -->
    <section id="screen-quiz" class="screen">
      <header class="quiz-top">
        <span id="q-counter" class="muted">1 / 25</span>
        <span id="q-score" class="muted">0 correctas</span>
      </header>
      <div class="progress"><div id="progress-bar" class="progress-bar"></div></div>
      <h2 id="q-text" class="question"></h2>
      <div id="answers" class="answers"></div>
      <div id="feedback" class="feedback hidden">
        <p id="feedback-text"></p>
        <button id="next-btn" class="btn btn-primary">Siguiente</button>
      </div>
    </section>

    <!-- Final -->
    <section id="screen-end" class="screen">
      <p class="eyebrow">Prueba terminada</p>
      <h1 id="end-name"></h1>
      <div class="stats">
        <div><span id="end-correct" class="stat-num">0</span><span class="muted">correctas</span></div>
        <div><span id="end-pct" class="stat-num">0%</span><span class="muted">calificación</span></div>
        <div><span id="end-time" class="stat-num">0s</span><span class="muted">tiempo</span></div>
      </div>
      <p id="sent-ok" class="sent-ok hidden">✓ Tus respuestas se enviaron correctamente.</p>
      <p id="save-status" class="muted"></p>
      <div class="row">
        <button id="send-btn" class="btn btn-primary">Enviar respuestas</button>
        <button id="retry-btn" class="btn">Volver a intentarlo</button>
        <button id="home-btn" class="btn hidden">Volver al inicio</button>
      </div>
    </section>

  </main>
  <script src="config.js?v=2"></script>
  <script src="preguntas.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
